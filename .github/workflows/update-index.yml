name: Update Articles Index

on:
  workflow_dispatch:
  push:
    paths:
      - "data/articles/batch-*.json"
      - "assets/images/**"
      - "build-site.js"
      - "convert-images.js"
      - "article-template.html"

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install image tool (sharp)
        run: npm install sharp --no-save --no-package-lock --prefix /tmp/imgtools

      - name: Convert png/jpg images to webp
        run: NODE_PATH=/tmp/imgtools/node_modules node convert-images.js

      - name: Run index generator
        run: node generate-index.js

      - name: Build article pages, homepage cards and sitemap
        run: node build-site.js

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-update index, article pages and sitemap"
          git pull --rebase
          git push

      - name: Bing ko naye URLs bhejo (IndexNow)
        continue-on-error: true
        run: |
          sleep 90
          node indexnow.js
